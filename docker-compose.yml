# EC2 테스트 서버용: 백엔드 + MySQL. 사용법은 DEPLOY.md 참고
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: timer_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # 포트를 외부에 열지 않음 (백엔드 컨테이너에서만 접근)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      # 기본값 dev는 H2 메모리 DB(create-drop)라 재시작하면 데이터가 날아감
      SPRING_PROFILES_ACTIVE: prod
      # application.properties의 localhost:3306 대신 mysql 컨테이너로 접속
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/timer_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      TZ: Asia/Seoul
    ports:
      - "8080:8080"

volumes:
  mysql-data:
