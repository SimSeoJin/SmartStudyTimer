# H2 데이터베이스 (개발용 - MySQL 없이 실행)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔 활성화 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

kakao.client-id=${KAKAO_CLIENT_ID:9b2b9bfa5edfe658b4281a52fb33a0fe}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-production-32bytes-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 개발 모드
app.dev-mode.enabled=true