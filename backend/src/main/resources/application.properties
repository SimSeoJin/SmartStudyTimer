spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:mysql://localhost:3306/timer_db?serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

kakao.client-id=${KAKAO_CLIENT_ID:9b2b9bfa5edfe658b4281a52fb33a0fe}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}

naver.client-id=${NAVER_CLIENT_ID:REPLACE_WITH_NAVER_CLIENT_ID}
naver.client-secret=${NAVER_CLIENT_SECRET:REPLACE_WITH_NAVER_CLIENT_SECRET}
naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8080/login/oauth2/code/naver}

google.client-id=${GOOGLE_CLIENT_ID:REPLACE_WITH_GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET:REPLACE_WITH_GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
# 앱(안드로이드) OAuth 클라이언트 ID 등 추가로 허용할 클라이언트 ID (쉼표로 구분)
google.allowed-client-ids=${GOOGLE_ALLOWED_CLIENT_IDS:}

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-production-32bytes-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 개발 모드 설정 (카카오 API 키 없이 테스트 가능)
app.dev-mode.enabled=false